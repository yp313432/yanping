name: Health MCP checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: health_test
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: health_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U health_test -d health_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      neon-proxy:
        image: ghcr.io/neondatabase/wsproxy:latest
        env:
          ALLOW_ADDR_REGEX: '^postgres:5432$'
          LOG_TRAFFIC: 'false'
          LOG_CONN_INFO: 'false'
        ports:
          - 55433:80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: install
        run: npm ci --ignore-scripts
      - id: worker-install
        run: npm ci --prefix workers/health --ignore-scripts --no-audit
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:memory
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:health
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:health:postgres
        env:
          HEALTH_TEST_DATABASE_URL: postgres://health_test:synthetic_ci_only@127.0.0.1:5432/health_test
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
      - if: ${{ !cancelled() && steps.worker-install.outcome == 'success' }}
        run: npm run typecheck --prefix workers/health
      - if: ${{ !cancelled() && steps.worker-install.outcome == 'success' }}
        run: npm run build --prefix workers/health && npm run build:test --prefix workers/health
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.worker-install.outcome == 'success' }}
        with:
          name: health-worker-build
          path: workers/health/dist/index.js
          if-no-files-found: error
          retention-days: 7
      - if: ${{ !cancelled() && steps.worker-install.outcome == 'success' }}
        run: npm test --prefix workers/health
        env:
          HEALTH_TEST_DATABASE_URL: postgres://health_test:synthetic_ci_only@127.0.0.1:5432/health_test
