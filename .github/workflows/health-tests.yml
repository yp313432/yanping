name: Health MCP checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: health_test
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: health_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U health_test -d health_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:memory
      - run: npm run test:health
      - run: npm run test:health:postgres
        env:
          HEALTH_TEST_DATABASE_URL: postgres://health_test:synthetic_ci_only@127.0.0.1:5432/health_test
      - run: npm run typecheck
      - run: npm run build
